<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <!-- Google Play feature graphic: 1024×500 -->
  <rect width="1024" height="500" fill="#FFFFFF"/>

  <!--
    Chef hat centered horizontally, vertically above center.
    scale=14, translate(338, 30) → icon area: x[408,604] y[72,324], center=(506,198)
    strokeWidth=0.95 → ~13px stroke at this scale (crisp at 1024px).
  -->
  <g transform="translate(338,30) scale(14)"
     fill="none" stroke="#EA580C" stroke-width="0.95"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/>
    <path d="M6 17h12"/>
  </g>

  <!-- App name -->
  <text x="512" y="385"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="62" font-weight="600" letter-spacing="-1"
        fill="#1A1A1A" text-anchor="middle">Recipe Collection</text>

  <!-- Tagline -->
  <text x="512" y="450"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="28" font-weight="400"
        fill="#6B6B6B" text-anchor="middle">All your recipes, always at hand</text>
</svg>
