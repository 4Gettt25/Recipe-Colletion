<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Collection — Shared Recipe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      color: #ea580c;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; }
    .meta { font-size: 13px; color: #888; margin-bottom: 16px; }
    .description { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
    .tag {
      background: #f3f4f6;
      color: #555;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover { background: #c2410c; }
    .hint { font-size: 12px; color: #aaa; text-align: center; margin-top: 14px; }
    .error { color: #b91c1c; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">Recipe Collection</div>
    <p class="error" id="error" style="display:none">Invalid share link.</p>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <p class="description" id="desc"></p>
    <div class="tags" id="tags"></div>
    <a class="btn" id="openBtn" href="#">Open in Recipe Collection</a>
    <p class="hint">Tap the button to import this recipe into the app.</p>
  </div>

  <script>
    (function () {
      var hash = location.hash.slice(1);
      if (!hash) { showError(); return; }

      // Redirect the app via custom scheme (opens app if installed)
      var appUrl = 'recipes://share#' + hash;
      location.href = appUrl;

      // Decode and show recipe preview as fallback
      try {
        var json = decodeURIComponent(escape(atob(hash)));
        var raw = JSON.parse(json);

        var title, description, ingredients, tags, imageUrl, portions;

        if (raw.v === 2) {
          title = raw.t; description = raw.d;
          ingredients = raw.i; tags = raw.g;
          imageUrl = raw.m; portions = raw.p;
        } else if (raw.v === 1) {
          title = raw.title; description = raw.description;
          ingredients = raw.ingredients; tags = raw.tags;
          imageUrl = raw.imageUrl; portions = raw.basePortions;
        } else {
          showError(); return;
        }

        document.getElementById('title').textContent = title || 'Shared Recipe';
        document.getElementById('meta').textContent =
          (ingredients ? ingredients.length : 0) + ' ingredients · ' + (portions || 1) + ' portions';
        if (description) document.getElementById('desc').textContent = description;
        if (tags && tags.length) {
          tags.forEach(function(tag) {
            var span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            document.getElementById('tags').appendChild(span);
          });
        }
        document.getElementById('openBtn').href = appUrl;
      } catch (e) {
        showError();
      }

      function showError() {
        document.getElementById('error').style.display = '';
        document.getElementById('title').style.display = 'none';
        document.getElementById('openBtn').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
